<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Autores</title>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}" />
</head>
<body>
<div class="container-fluid mt-4">
    <div class="d-flex flex-nowrap align-items-center gap-2 mb-3">
        <nav aria-label="Paginación de autores" th:if="${autoresPage.totalPages > 1}" class="flex-shrink-0">
            <ul class="pagination mb-0" style="font-size: 0.85rem;">
                <li class="page-item" th:classappend="${autoresPage.first} ? ' disabled'">
                    <a class="page-link" th:href="@{/autores(page=0, query=${query}, premioQuery=${premioQuery}, sortField=${sortField}, sortDir=${sortDir})}" tabindex="-1">Prim.</a>
                </li>
                <li class="page-item" th:classappend="${autoresPage.first} ? ' disabled'">
                    <a class="page-link" th:href="@{/autores(page=${currentPage - 1}, query=${query}, premioQuery=${premioQuery}, sortField=${sortField}, sortDir=${sortDir})}">Ant.</a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(currentPage, currentPage + 4 < autoresPage.totalPages ? currentPage + 4 : autoresPage.totalPages - 1)}" th:classappend="${i == currentPage} ? ' active'">
                    <a class="page-link" th:href="@{/autores(page=${i}, query=${query}, premioQuery=${premioQuery}, sortField=${sortField}, sortDir=${sortDir})}" th:text="${i + 1}"></a>
                </li>
                <li class="page-item" th:classappend="${autoresPage.last} ? ' disabled'">
                    <a class="page-link" th:href="@{/autores(page=${currentPage + 1}, query=${query}, premioQuery=${premioQuery}, sortField=${sortField}, sortDir=${sortDir})}">Sig.</a>
                </li>
                <li class="page-item" th:classappend="${autoresPage.last} ? ' disabled'">
                    <a class="page-link" th:href="@{/autores(page=${autoresPage.totalPages - 1}, query=${query}, premioQuery=${premioQuery}, sortField=${sortField}, sortDir=${sortDir})}">Últ.</a>
                </li>
            </ul>
        </nav>
        <div class="flex-grow-1 d-flex justify-content-center">
            <form th:action="@{/autores}" method="get" class="d-flex align-items-center gap-2">
                <input type="hidden" name="sortField" th:value="${sortField}" />
                <input type="hidden" name="sortDir" th:value="${sortDir}" />
                <input type="search" name="query" class="form-control" placeholder="Buscar nombre" th:value="${query}" style="width: 220px;" />
                <input type="search" name="premioQuery" class="form-control" placeholder="Buscar premio" th:value="${premioQuery}" style="width: 220px;" />
                <button type="submit" class="btn btn-outline-primary btn-sm">Buscar</button>
            </form>
        </div>
        <a th:href="@{/}" class="btn btn-outline-secondary flex-shrink-0">Inicio</a>
        <a th:href="@{/autores/new}" class="btn btn-success flex-shrink-0">Crear autor</a>
    </div>
    <div class="table-responsive">
        <table class="table table-hover table-bordered align-middle">
    <thead>
    <tr>
        <th style="width:72px;">Foto</th>
        <th style="width:320px;">
            <div class="d-flex justify-content-between align-items-center">
                <span>Nombre</span>
                <div class="d-flex flex-column align-items-end ms-2" style="display:inline-block;">
                    <a th:href="@{/autores(page=0, query=${query}, premioQuery=${premioQuery}, sortField='nomAutor', sortDir='asc')}" class="btn btn-link btn-sm p-0" style="font-size:0.7rem;line-height:0.8;" title="Ordenar asc">▲</a>
                    <a th:href="@{/autores(page=0, query=${query}, premioQuery=${premioQuery}, sortField='nomAutor', sortDir='desc')}" class="btn btn-link btn-sm p-0" style="font-size:0.7rem;line-height:0.8;" title="Ordenar desc">▼</a>
                </div>
            </div>
        </th>
        <th style="width:70px;" class="text-center">País</th>
        <th style="width:240px;">Localidad</th>
        <th style="width:100px;">
            <div class="d-flex justify-content-between align-items-center">
                <span>F. Nac.</span>
                <div class="d-flex flex-column align-items-end ms-2" style="display:inline-block;">
                    <a th:href="@{/autores(page=0, query=${query}, premioQuery=${premioQuery}, sortField='fechaNacimiento', sortDir='asc')}" class="btn btn-link btn-sm p-0" style="font-size:0.7rem;line-height:0.8;" title="Ordenar asc">▲</a>
                    <a th:href="@{/autores(page=0, query=${query}, premioQuery=${premioQuery}, sortField='fechaNacimiento', sortDir='desc')}" class="btn btn-link btn-sm p-0" style="font-size:0.7rem;line-height:0.8;" title="Ordenar desc">▼</a>
                </div>
            </div>
        </th>
        <th style="width:70px;">F. Def.</th>
        <th style="width:60px;" class="text-center">Edad</th>
        <th style="width:300px;">Premios</th>
        <th style="width:360px;">Libros</th>
        <th style="width:140px;" class="text-center">Acciones</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="autor : ${autoresPage.content}">
        <td>
                <a th:if="${autor.foto != null}" href="#" class="foto-modal-trigger"
                    th:data-src="@{/img/autores/{foto}(foto=${autor.foto})}"
                    th:data-title="${autor.nomAutor} + ' ' + ${autor.apellido1 == null ? '' : autor.apellido1} + ' ' + ${autor.apellido2 == null ? '' : autor.apellido2}">
                <img th:src="@{/img/autores/{foto}(foto=${autor.foto})}" th:alt="'Foto de ' + ${autor.nomAutor}"
                     class="rounded" style="width:64px;height:64px;object-fit:cover;cursor:pointer;" />
            </a>
            <span th:if="${autor.foto == null}">Sin foto</span>
        </td>
        <td><strong th:text="${autor.nomAutor} + ' ' + ${autor.apellido1} + ' ' + ${autor.apellido2}"></strong></td>
        <td class="text-center">
            <div th:if="${autor.pais != null}" class="text-center">
                <img th:src="@{/img/paises/{bandera}(bandera=${autor.pais.bandera})}" th:alt="${autor.pais.nomPais}"
                     style="width:24px;height:18px;object-fit:cover;display:block;margin:0 auto;" />
                <div class="small text-muted" th:text="${autor.pais.nomPais}"></div>
            </div>
            <div th:if="${autor.pais == null}">N/A</div>
        </td>
        <td th:text="${autor.localidad != null and !#strings.isEmpty(#strings.trim(autor.localidad)) ? autor.localidad : '---'}"></td>
        <td th:text="${autor.fechaNacimiento != null ? #dates.format(autor.fechaNacimiento, 'dd/MM/yyyy') : ''}"></td>
        <td th:text="${autor.fechaDefuncion != null ? #dates.format(autor.fechaDefuncion, 'dd/MM/yyyy') : ''}"></td>
        <td class="text-center">
            <span th:if="${autor.fechaDefuncion == null and autor.fechaNacimiento != null}"
                  th:text="${T(java.time.Period).between(autor.fechaNacimiento.toLocalDate(), T(java.time.LocalDate).now()).getYears()}"></span>
        </td>
        <td style="font-size:0.7rem;line-height:1.25;">
            <ul class="list-unstyled mb-0">
                <li th:each="ap : ${autor.premiosOrdenadosPorAnioAsc}" th:text="|${ap.premio.nomPremio} (${ap.anio})|"></li>
            </ul>
        </td>
        <td style="font-size:0.7rem;line-height:1.25;">
            <div class="overflow-auto" style="max-height:4.2rem;">
                <ul class="list-unstyled mb-0">
                    <li th:each="libro : ${autor.librosOrdenadosPorAnoAsc}" th:text="|${libro.nomLibro} (${libro.ano})|"></li>
                </ul>
            </div>
        </td>
        <td class="text-center" style="font-size:0.85rem;">
            <a th:href="@{'/autores/view/' + ${autor.id}}" class="btn btn-outline-primary btn-sm p-1 me-1" title="Ver">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8z"/>
                    <path d="M8 5.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5z" fill="#fff"/>
                </svg>
            </a>
            <a th:href="@{'/autores/edit/' + ${autor.id}}" class="btn btn-outline-secondary btn-sm p-1 me-1" title="Editar">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M12.146.854a.5.5 0 0 1 .708 0l2.292 2.292a.5.5 0 0 1 0 .708L4.207 14.793 1 15l.207-3.207L12.146.854z"/>
                </svg>
            </a>
            <form th:action="@{'/autores/delete/' + ${autor.id}}" method="post" class="d-inline">
                <button type="submit" class="btn btn-outline-danger btn-sm p-1" title="Borrar" onclick="return confirm('Confirma borrado?');">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                        <path d="M5.5 5.5A.5.5 0 0 1 6 5h4a.5.5 0 0 1 .5.5V6h1v1H4V6h1v-.5z"/>
                        <path d="M14.5 3a1 1 0 0 1-1 1H12v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4H2.5a1 1 0 0 1-1-1V2h13v1z"/>
                    </svg>
                </button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
    </div>
</div>

<div class="modal fade" id="fotoModal" tabindex="-1" aria-labelledby="fotoModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="fotoModalTitle"></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body text-center">
                <img id="modalImage" src="" alt="Foto del autor" class="img-fluid rounded" style="max-height:60vh;" />
            </div>
        </div>
    </div>
</div>

<script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>

<script>
document.addEventListener('DOMContentLoaded', () => {

    const modalElement = document.getElementById('fotoModal');
    const fotoModal = new bootstrap.Modal(modalElement);
    const modalImage = document.getElementById('modalImage');
    const modalTitle = document.getElementById('fotoModalTitle');

    document.querySelectorAll('.foto-modal-trigger').forEach(el => {
        el.addEventListener('click', event => {
            event.preventDefault();
            modalImage.src = el.dataset.src;
            modalTitle.textContent = (el.dataset.title || '').trim();
            fotoModal.show();
        });
    });

});
</script>
</body>
</html>
