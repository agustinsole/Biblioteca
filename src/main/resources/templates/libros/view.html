<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Ver Libro</title>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}" />
    <style>
        body {
            font-family: "Palatino Linotype", "Book Antiqua", Palatino, serif;
            color: #1f2937;
        }
        .book-title {
            letter-spacing: 0.04em;
            font-weight: 700;
            margin-bottom: 1.25rem;
        }
        .book-meta {
            font-size: 1.05rem;
            line-height: 1.6;
        }
        .pdf-link {
            display: inline-block;
            font-size: 1.05rem;
            font-weight: 700;
            text-transform: uppercase;
            text-decoration: none;
            color: #0d6efd;
        }
        .pdf-link:hover {
            color: #0a58ca;
            text-decoration: none;
        }
        .video-wrap {
            max-width: 720px;
            margin: 0 auto;
        }
        .comment-text {
            font-size: 1.05rem;
            line-height: 1.7;
            white-space: pre-line;
            text-align: justify;
        }
    </style>
</head>
<body>
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-start gap-3 mb-3">
        <h1 class="book-title mb-0" th:text="${#strings.toUpperCase(libro.nomLibro) + ' (' + libro.ano + ')'}"></h1>
        <a th:href="@{/libros}" class="btn btn-outline-secondary">Volver</a>
    </div>

    <div class="row g-4 align-items-start mb-4">
        <div class="col-12 col-md-3 text-center text-md-start">
            <img th:if="${libro.portada != null and !#strings.isEmpty(libro.portada)}"
                 th:src="@{/img/libros/{portada}(portada=${libro.portada})}"
                 th:alt="${libro.nomLibro}"
                 class="img-fluid rounded shadow-sm"
                 style="max-height: 420px; object-fit: contain;" />
            <span th:if="${libro.portada == null or #strings.isEmpty(libro.portada)}">Sin portada</span>
        </div>

        <div class="col-12 col-md-9">
            <div class="book-meta mb-3">
                <h2 class="h6 text-uppercase text-secondary mb-2">Autor/es</h2>
                <ul class="list-unstyled mb-0" th:if="${libro.autorLibros != null and !libro.autorLibros.isEmpty()}">
                    <li th:each="al : ${libro.autorLibros}"
                        th:text="${al.autor.nomAutor + ' ' + (al.autor.apellido1 != null ? al.autor.apellido1 : '') + ' ' + (al.autor.apellido2 != null ? al.autor.apellido2 : '')}"></li>
                </ul>
                <p class="text-muted mb-0" th:if="${libro.autorLibros == null or libro.autorLibros.isEmpty()}">Sin autores registrados.</p>
            </div>

            <div class="book-meta mb-3">
                <h2 class="h6 text-uppercase text-secondary mb-2">Premios</h2>
                <ul class="list-unstyled mb-0" th:if="${libro.libroPremios != null and !libro.libroPremios.isEmpty()}">
                    <li th:each="lp : ${libro.libroPremios}" class="d-flex align-items-center mb-1">
                        <img th:if="${lp.premio.logotipo != null and !#strings.isEmpty(lp.premio.logotipo)}"
                             th:src="@{/img/premios/{logotipo}(logotipo=${lp.premio.logotipo})}"
                             th:alt="${lp.premio.nomPremio}"
                             class="me-2"
                             style="width:22px;height:22px;object-fit:contain;" />
                        <span th:text="${lp.premio.nomPremio}"></span>
                    </li>
                </ul>
                <p class="text-muted mb-0" th:if="${libro.libroPremios == null or libro.libroPremios.isEmpty()}">Sin premios registrados.</p>
            </div>

            <p class="book-meta mb-0" th:if="${libro.serie != null and libro.serie.denominacion != null and !#strings.equalsIgnoreCase(#strings.trim(libro.serie.denominacion), 'No')}">
                <strong>Serie:</strong> <span th:text="${libro.serie.denominacion}"></span>
                <span th:if="${libro.indiceSerie != null}"> - <strong>Índice:</strong> <span th:text="${libro.indiceSerie}"></span></span>
            </p>

            <p class="mt-3 mb-2" th:if="${libro.nomArchivo != null and !#strings.isEmpty(#strings.trim(libro.nomArchivo)) and #strings.trim(libro.nomArchivo) != '0'}">
                <a th:href="@{/pdfs/{archivo}(archivo=${#strings.trim(libro.nomArchivo)})}"
                   class="pdf-link"
                   target="_blank"
                   rel="noopener noreferrer">PDF</a>
            </p>

            <div class="mt-2" th:if="${libro.comentario != null and !#strings.isEmpty(#strings.trim(libro.comentario))}">
                <h2 class="h6 text-uppercase text-secondary mb-2">Sinopsis</h2>
                <p class="comment-text p-3 border rounded bg-light mb-0" th:text="${libro.comentario}"></p>
            </div>
        </div>
    </div>
<div class="video-wrap text-center mb-4" th:if="${libro.pelicula != null and !#strings.isEmpty(#strings.trim(libro.pelicula)) and #strings.trim(libro.pelicula) != '0'}">
    <video id="videoPelicula" class="w-100 rounded shadow-sm" controls preload="metadata">
        <source th:src="@{/videos/{archivo}(archivo=${#strings.trim(libro.pelicula)})}" type="video/mp4" />
        Tu navegador no soporta el vídeo.
    </video>
</div>
</div>
</body>
</html>
