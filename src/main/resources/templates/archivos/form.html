<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de archivos</title>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}" />
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4 mb-0">Gestión de archivos</h1>
        <a th:href="@{/}" class="btn btn-outline-secondary">Inicio</a>
    </div>

    <div th:if="${mensaje != null}" class="alert alert-success" role="alert" th:text="${mensaje}"></div>
    <div th:if="${error != null}" class="alert alert-danger" role="alert" th:text="${error}"></div>

    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body">
            <h2 class="h6 text-uppercase text-muted mb-3">Subir archivos</h2>
            <form th:action="@{/archivos/subir}" method="post" enctype="multipart/form-data" class="row g-3 align-items-end">
                <div class="col-12 col-lg-6">
                    <label for="archivos" class="form-label fw-semibold">Archivo(s)</label>
                    <input id="archivos" name="archivos" type="file" class="form-control" multiple required />
                </div>
                <div class="col-12 col-lg-4">
                    <label for="carpeta" class="form-label fw-semibold">Carpeta de destino</label>
                    <select id="carpeta" name="carpeta" class="form-select" required>
                        <option value="autores">Imágenes de autores</option>
                        <option value="libros">Imágenes de libros</option>
                        <option value="pdfs">PDFs</option>
                        <option value="videos">Vídeos</option>
                    </select>
                </div>
                <div class="col-12 col-lg-2">
                    <button type="submit" class="btn btn-primary w-100">Subir</button>
                </div>
            </form>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-12 col-lg-6">
            <div class="card shadow-sm border-0 h-100">
                <div class="card-body d-flex flex-column">
                    <h2 class="h6 text-uppercase text-muted">Imágenes de autores</h2>
                    <form th:action="@{/archivos/eliminar}" method="post" class="d-flex flex-column flex-grow-1">
                        <input type="hidden" name="carpeta" value="autores" />
                        <ul class="list-group flex-grow-1 mb-3" style="max-height: 260px; overflow-y: auto;">
                            <li class="list-group-item" th:each="nombre : ${archivosAutores}">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="seleccionados" th:value="${nombre}" th:id="${'autores-' + nombre}" />
                                    <label class="form-check-label" th:for="${'autores-' + nombre}" th:text="${nombre}"></label>
                                </div>
                            </li>
                            <li class="list-group-item text-muted" th:if="${#lists.isEmpty(archivosAutores)}">Sin archivos.</li>
                        </ul>
                        <button type="submit" class="btn btn-outline-danger align-self-start" onclick="return confirm('¿Eliminar los archivos seleccionados?');">Eliminar seleccionados</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-12 col-lg-6">
            <div class="card shadow-sm border-0 h-100">
                <div class="card-body d-flex flex-column">
                    <h2 class="h6 text-uppercase text-muted">Imágenes de libros</h2>
                    <form th:action="@{/archivos/eliminar}" method="post" class="d-flex flex-column flex-grow-1">
                        <input type="hidden" name="carpeta" value="libros" />
                        <ul class="list-group flex-grow-1 mb-3" style="max-height: 260px; overflow-y: auto;">
                            <li class="list-group-item" th:each="nombre : ${archivosLibros}">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="seleccionados" th:value="${nombre}" th:id="${'libros-' + nombre}" />
                                    <label class="form-check-label" th:for="${'libros-' + nombre}" th:text="${nombre}"></label>
                                </div>
                            </li>
                            <li class="list-group-item text-muted" th:if="${#lists.isEmpty(archivosLibros)}">Sin archivos.</li>
                        </ul>
                        <button type="submit" class="btn btn-outline-danger align-self-start" onclick="return confirm('¿Eliminar los archivos seleccionados?');">Eliminar seleccionados</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-12 col-lg-6">
            <div class="card shadow-sm border-0 h-100">
                <div class="card-body d-flex flex-column">
                    <h2 class="h6 text-uppercase text-muted">PDFs</h2>
                    <form th:action="@{/archivos/eliminar}" method="post" class="d-flex flex-column flex-grow-1">
                        <input type="hidden" name="carpeta" value="pdfs" />
                        <ul class="list-group flex-grow-1 mb-3" style="max-height: 260px; overflow-y: auto;">
                            <li class="list-group-item" th:each="nombre : ${archivosPdfs}">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="seleccionados" th:value="${nombre}" th:id="${'pdfs-' + nombre}" />
                                    <label class="form-check-label" th:for="${'pdfs-' + nombre}" th:text="${nombre}"></label>
                                </div>
                            </li>
                            <li class="list-group-item text-muted" th:if="${#lists.isEmpty(archivosPdfs)}">Sin archivos.</li>
                        </ul>
                        <button type="submit" class="btn btn-outline-danger align-self-start" onclick="return confirm('¿Eliminar los archivos seleccionados?');">Eliminar seleccionados</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-12 col-lg-6">
            <div class="card shadow-sm border-0 h-100">
                <div class="card-body d-flex flex-column">
                    <h2 class="h6 text-uppercase text-muted">Vídeos</h2>
                    <form th:action="@{/archivos/eliminar}" method="post" class="d-flex flex-column flex-grow-1">
                        <input type="hidden" name="carpeta" value="videos" />
                        <ul class="list-group flex-grow-1 mb-3" style="max-height: 260px; overflow-y: auto;">
                            <li class="list-group-item" th:each="nombre : ${archivosVideos}">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="seleccionados" th:value="${nombre}" th:id="${'videos-' + nombre}" />
                                    <label class="form-check-label" th:for="${'videos-' + nombre}" th:text="${nombre}"></label>
                                </div>
                            </li>
                            <li class="list-group-item text-muted" th:if="${#lists.isEmpty(archivosVideos)}">Sin archivos.</li>
                        </ul>
                        <button type="submit" class="btn btn-outline-danger align-self-start" onclick="return confirm('¿Eliminar los archivos seleccionados?');">Eliminar seleccionados</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
