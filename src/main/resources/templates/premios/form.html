<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Premio</title>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}" />
</head>
<body>
<h1 th:text="${premio.id} != null ? 'Editar Premio' : 'Crear Premio'"></h1>
<form th:action="@{/premios}" th:object="${premio}" method="post">
    <input type="hidden" th:field="*{id}" />
    <div><label>Nombre</label><textarea th:field="*{nomPremio}" rows="3"></textarea></div>
    <div>
        <label>País</label>
        <select th:field="*{pais.id}">
            <option value="">-- Selecciona --</option>
            <option th:each="pais : ${paises}" th:value="${pais.id}" th:text="${pais.nomPais}"></option>
        </select>
    </div>
    <div><label>Tipo</label><input type="text" th:field="*{tipo}" /></div>
    <div><button type="submit">Guardar</button><a th:href="@{/premios}">Cancelar</a></div>
</form>
</body>
</html>
